<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd8ff">
<meta name="format-detection" content="telephone=no">
<title>Лови ракету</title>
<style>
:root{
  --ink:#2b2d42;
  --green:#3ecf6e; --green-d:#22a552;
  --orange:#ff9f1c; --orange-d:#d47a00;
  --blue:#4c8dff; --blue-d:#2c62cf;
  --pink:#ff5d8f; --pink-d:#d63d6e;
  --panel:#fffdf6;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
  --ib:54px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  position:fixed;inset:0;width:100%;height:100%;overflow:hidden;
  background:#8fd8ff;color:var(--ink);
  touch-action:none;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  font-family:"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
body.playing canvas#c{cursor:none}
#safe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;
  padding:var(--sat) var(--sar) var(--sab) var(--sal)}

.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2.4vmin,22px);
  padding:calc(12px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal))}
.screen.on{display:flex}
.screen.overlay{background:rgba(43,45,66,.38)}
.screen.dim{background:rgba(255,255,255,.28)}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
svg{display:block}

.btn{
  font-weight:800;font-size:clamp(22px,2.4vmin + 14px,34px);color:#fff;letter-spacing:.01em;
  border-radius:999px;padding:.35em 1.15em .38em;min-height:66px;min-width:220px;
  display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  background:var(--green);box-shadow:0 7px 0 var(--green-d),0 12px 20px rgba(0,0,0,.18);
  text-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .07s,box-shadow .07s;
}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--green-d),0 4px 8px rgba(0,0,0,.18)}
.btn svg{width:1.05em;height:1.05em;fill:currentColor;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.btn.orange{background:var(--orange);box-shadow:0 7px 0 var(--orange-d),0 12px 20px rgba(0,0,0,.18)}
.btn.orange:active{box-shadow:0 2px 0 var(--orange-d)}
.btn.blue{background:var(--blue);box-shadow:0 7px 0 var(--blue-d),0 12px 20px rgba(0,0,0,.18)}
.btn.blue:active{box-shadow:0 2px 0 var(--blue-d)}
.btn.pink{background:var(--pink);box-shadow:0 7px 0 var(--pink-d),0 12px 20px rgba(0,0,0,.18)}
.btn.pink:active{box-shadow:0 2px 0 var(--pink-d)}
.btn.small{font-size:clamp(20px,1.6vmin + 13px,26px);min-height:60px;min-width:0;padding:.3em .9em .32em}

.iconbtn{position:fixed;top:calc(8px + var(--sat));width:var(--ib);height:var(--ib);border-radius:50%;
  background:#fff;box-shadow:0 5px 0 #b9c6e0,0 8px 14px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;z-index:20;transition:transform .07s}
.iconbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #b9c6e0}
.iconbtn svg{width:58%;height:58%;fill:var(--ink)}
#btnSound{right:calc(10px + var(--sar))}
#btnPause{right:calc(20px + var(--ib) + var(--sar));display:none}
body.playing #btnPause{display:flex}
.iconbtn.back{left:calc(10px + var(--sal));right:auto}

/* главное меню */
.title{font-weight:900;line-height:.95;text-align:center;font-size:min(16vw,17vh,120px);letter-spacing:.01em;
  -webkit-text-stroke:.11em var(--ink);paint-order:stroke fill;
  filter:drop-shadow(0 .07em 0 rgba(43,45,66,.9));margin-bottom:.12em}
.title span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.title .w{display:inline-block;white-space:nowrap}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-.08em) rotate(2deg)}}
.menu-btns{display:flex;flex-direction:column;gap:22px;align-items:center}
#scrMenu{justify-content:center;padding-bottom:calc(16vh + 60px + var(--sab))}
#scrMenu .spacer{flex:0 0 2vh}
@media (orientation:landscape){
  .menu-btns{flex-direction:row;gap:26px}
  .title{font-size:min(12vw,19vh,120px)}
}

.h2{font-size:clamp(28px,4vmin + 14px,52px);font-weight:900;color:#fff;-webkit-text-stroke:.12em var(--ink);paint-order:stroke fill;
  filter:drop-shadow(0 .07em 0 rgba(43,45,66,.9));text-align:center;line-height:1}

/* уровни */
.levels{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,3.4vmin,30px);max-width:840px}
.lvl{position:relative;width:clamp(86px,min(24vw,24vh),132px);aspect-ratio:1;border-radius:50%;
  background:var(--c,#4c8dff);box-shadow:0 7px 0 rgba(0,0,0,.25),0 12px 18px rgba(0,0,0,.18), inset 0 -8px 0 rgba(0,0,0,.12), inset 0 8px 0 rgba(255,255,255,.25);
  color:#fff;font-weight:900;font-size:clamp(40px,min(11vw,11vh),64px);display:flex;align-items:center;justify-content:center;
  text-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .07s}
.lvl:active{transform:translateY(5px)}
.lvl .stars{position:absolute;bottom:-.42em;left:50%;transform:translateX(-50%);font-size:.42em;white-space:nowrap;letter-spacing:-.05em;
  -webkit-text-stroke:.09em var(--ink);paint-order:stroke fill;text-shadow:none}
.lvl .stars .on{color:#ffd23f}.lvl .stars .off{color:#e6e9f5}
.lvl.locked{background:#b7bdd3;color:#8a90aa;text-shadow:none}
.lvl.locked svg{width:44%;height:44%;fill:#fff;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.lvl.next{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* скины */
#scrSkins{justify-content:flex-start;padding-top:calc(14px + var(--sat))}
#scrSkins .h2{margin-top:6px}
.skins{flex:1;min-height:0;width:100%;max-width:980px;display:grid;gap:clamp(8px,2vmin,16px);
  grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,minmax(0,1fr))}
@media (orientation:landscape){.skins{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr))}}
.skin{position:relative;background:var(--panel);border-radius:22px;box-shadow:0 5px 0 #c9d1e6,0 10px 16px rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;padding:6px 8px 8px;min-height:0;overflow:hidden}
.skin canvas{flex:1;min-height:0;width:100%;object-fit:contain}
.skin .nm{font-weight:900;font-size:clamp(15px,1.4vmin + 10px,22px);line-height:1.1;text-align:center}
.skin .how{font-weight:700;font-size:clamp(12px,1vmin + 8px,17px);color:#6b6f8f;text-align:center;line-height:1.15}
.skin .bar{width:80%;height:8px;border-radius:9px;background:#e3e7f3;margin-top:4px;overflow:hidden}
.skin .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff9f1c);border-radius:9px}
.skin.sel{box-shadow:0 0 0 5px #3ecf6e,0 5px 0 #22a552,0 10px 16px rgba(0,0,0,.12)}
.skin .badge{position:absolute;top:8px;right:8px;background:#3ecf6e;color:#fff;border-radius:999px;font-weight:900;
  font-size:clamp(12px,1vmin + 8px,16px);padding:3px 10px 4px;box-shadow:0 3px 0 #22a552}
.skin.locked .nm{color:#7a7f9e}

/* панели оверлеев */
.panel{background:var(--panel);border-radius:30px;box-shadow:0 9px 0 #c9d1e6,0 20px 40px rgba(0,0,0,.25);
  padding:clamp(16px,3.4vmin,30px) clamp(18px,4vmin,40px);display:flex;flex-direction:column;align-items:center;
  gap:clamp(8px,1.8vmin,16px);max-width:92vw;animation:popin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.panel .big{font-size:clamp(40px,7vmin + 14px,78px);font-weight:900;line-height:1;color:#fff;-webkit-text-stroke:.12em var(--ink);paint-order:stroke fill}
.panel .big.win{color:#ffd23f}.panel .big.lose{color:#8fd8ff}.panel .big.pause{color:#b9a6ff}
.panel .sub{font-size:clamp(20px,2vmin + 13px,30px);font-weight:800;text-align:center}
.panel .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.bigstars{display:flex;gap:6px;font-size:clamp(46px,8vmin + 10px,84px);line-height:1}
.bigstars span{-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;color:#e6e9f5;display:inline-block;transform:scale(0)}
.bigstars span.on{color:#ffd23f}
.bigstars span.go{animation:starpop .45s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@media (max-height:480px){
  :root{--ib:48px}
  .btn{min-height:58px;font-size:24px}
  .btn.small{min-height:54px;font-size:21px}
  .panel{flex-direction:column;gap:6px;padding:12px 22px}
  .panel .big{font-size:44px}
  .bigstars{font-size:44px}
  .panel .sub{font-size:20px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>

<button class="iconbtn" id="btnSound" aria-label="Звук"></button>
<button class="iconbtn" id="btnPause" aria-label="Пауза"></button>

<div class="screen" id="scrMenu">
  <h1 class="title" id="title"></h1>
  <div class="spacer"></div>
  <div class="menu-btns">
    <button class="btn" data-act="levels" id="btnPlay"><i data-icon="play"></i>Играть</button>
    <button class="btn orange" data-act="skins"><i data-icon="scooter"></i>Скины</button>
  </div>
</div>

<div class="screen dim" id="scrLevels">
  <button class="iconbtn back" data-act="menu" aria-label="Назад"><i data-icon="back"></i></button>
  <div class="h2">Выбери уровень</div>
  <div class="levels" id="levels"></div>
</div>

<div class="screen dim" id="scrSkins">
  <button class="iconbtn back" data-act="menu" aria-label="Назад"><i data-icon="back"></i></button>
  <div class="h2">Скины</div>
  <div class="skins" id="skins"></div>
</div>

<div class="screen overlay" id="scrPause">
  <div class="panel">
    <div class="big pause">Пауза</div>
    <div class="row">
      <button class="btn" data-act="resume"><i data-icon="play"></i>Дальше</button>
    </div>
    <div class="row">
      <button class="btn small blue" data-act="restart"><i data-icon="retry"></i>Заново</button>
      <button class="btn small orange" data-act="levels"><i data-icon="home"></i>Меню</button>
    </div>
  </div>
</div>

<div class="screen overlay" id="scrWin">
  <div class="panel">
    <div class="big win" id="winTitle">Ура!</div>
    <div class="bigstars" id="winStars"><span>★</span><span>★</span><span>★</span></div>
    <div class="sub" id="winSub">Поймано 10 ракет</div>
    <div class="row" id="winRow">
      <button class="btn" data-act="next" id="btnNext"><i data-icon="next"></i>Дальше</button>
    </div>
    <div class="row">
      <button class="btn small blue" data-act="restart"><i data-icon="retry"></i>Ещё раз</button>
      <button class="btn small orange" data-act="levels"><i data-icon="home"></i>Меню</button>
    </div>
  </div>
</div>

<div class="screen overlay" id="scrLose">
  <div class="panel">
    <div class="big lose">Ой-ой!</div>
    <div class="sub" id="loseSub">Поймано 7 из 10</div>
    <div class="row">
      <button class="btn pink" data-act="restart"><i data-icon="retry"></i>Ещё раз</button>
    </div>
    <div class="row">
      <button class="btn small orange" data-act="levels"><i data-icon="home"></i>Меню</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ================================================================
   СЛОЖНОСТЬ УРОВНЕЙ — подкручивать здесь
   goal   — сколько ракет надо поймать
   fall   — сколько секунд ракета летит от верха экрана до земли (меньше = быстрее)
   every  — через сколько секунд появляется следующая ракета (меньше = чаще)
   warn   — сколько секунд горит подсветка места, где появится ракета
   double — шанс, что ракеты прилетят парой (0 = никогда, 0.3 = в 3 случаях из 10)
   near   — сколько первых ракет падают прямо над игроком (чтобы сразу поймать)
   ================================================================ */
const LEVELS = [
  { goal: 10, fall: 3.3,  every: 1.75, warn: 0.85, double: 0,    near: 3 },
  { goal: 15, fall: 2.9,  every: 1.5,  warn: 0.75, double: 0,    near: 1 },
  { goal: 20, fall: 2.6,  every: 1.3,  warn: 0.7,  double: 0.15, near: 1 },
  { goal: 25, fall: 2.35, every: 1.15, warn: 0.6,  double: 0.25, near: 1 },
  { goal: 30, fall: 2.1,  every: 1.0,  warn: 0.55, double: 0.35, near: 1 },
];
const LIVES = 3;              // жизней на уровень
const PLAYER_SPEED = 1.25;    // скорость на стрелках: ширин поля в секунду
const FIRST_DELAY = 0.35;     // через сколько секунд после старта первая подсветка
const PAIR_GAP = 0.45;        // на сколько секунд вторая ракета из пары отстаёт от первой

/* Скины: в прототипе в игре только самокат, остальные закрыты */
const SKINS = [
  { id: 'scooter', name: 'Самокат' },
  { id: 'skate',   name: 'Скейтборд',        how: 'Поймай 50 ракет',  need: () => [save.total, 50] },
  { id: 'bike',    name: 'Велосипед',        how: 'Пройди уровень 2', need: () => [Math.min(save.passed, 2), 2] },
  { id: 'car',     name: 'Машинка',          how: 'Пройди уровень 3', need: () => [Math.min(save.passed, 3), 3] },
  { id: 'rollers', name: 'Ролики',           how: 'Поймай 100 ракет', need: () => [save.total, 100] },
  { id: 'hover',   name: 'Ракета-ховерборд', how: 'Пройди уровень 5', need: () => [Math.min(save.passed, 5), 5] },
];

const ROCKET_COLORS = [
  { body: '#ff5d73', acc: '#ffd23f' },
  { body: '#4cc9f0', acc: '#ff70a6' },
  { body: '#ffd23f', acc: '#7b61ff' },
  { body: '#7bd389', acc: '#ff8c42' },
  { body: '#b388ff', acc: '#4cc9f0' },
  { body: '#ff8c42', acc: '#3a86ff' },
  { body: '#ffffff', acc: '#ff5d73' },
];
const SPARK_COLORS = ['#ffd23f', '#ff70a6', '#4cc9f0', '#7bd389', '#b388ff', '#ffffff', '#ff8c42'];
const INK = '#2b2d42';
const FONT = '"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif';
const KID_HANDS = 108;   // высота рук ребёнка над землёй (в единицах рисунка)
const RIDER_W = 80;      // ширина самоката (в единицах рисунка)

/* ---------------- сохранение ---------------- */
const SAVE_KEY = 'rocketCatch.v1';
let save = { passed: 0, stars: [0, 0, 0, 0, 0], total: 0, muted: false, skin: 'scooter' };
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s && typeof s === 'object') {
      if (Number.isFinite(s.passed)) save.passed = Math.max(0, Math.min(LEVELS.length, s.passed | 0));
      if (Array.isArray(s.stars)) save.stars = LEVELS.map((_, i) => Math.max(0, Math.min(3, (s.stars[i] | 0))));
      if (Number.isFinite(s.total)) save.total = Math.max(0, s.total | 0);
      save.muted = !!s.muted;
    }
  } catch (e) { /* нет хранилища — играем без сохранения */ }
}
function storeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ }
}

/* ---------------- утилиты ---------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const lerp = (a, b, t) => a + (b - a) * t;

function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(ctx, x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5 - Math.PI / 2;
    const q = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q);
  }
  ctx.closePath();
}
function heartPath(ctx, x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.42);
  ctx.bezierCurveTo(x - s * 0.12, y + s * 0.32, x - s * 0.56, y + s * 0.06, x - s * 0.52, y - s * 0.2);
  ctx.bezierCurveTo(x - s * 0.48, y - s * 0.52, x - s * 0.08, y - s * 0.54, x, y - s * 0.24);
  ctx.bezierCurveTo(x + s * 0.08, y - s * 0.54, x + s * 0.48, y - s * 0.52, x + s * 0.52, y - s * 0.2);
  ctx.bezierCurveTo(x + s * 0.56, y + s * 0.06, x + s * 0.12, y + s * 0.32, x, y + s * 0.42);
  ctx.closePath();
}
// толстая линия с обводкой: сначала тёмная, потом цветная
function inkLine(ctx, pts, w, color) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const pass of [0, 1]) {
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.strokeStyle = pass ? color : INK;
    ctx.lineWidth = pass ? w : w + 4;
    ctx.stroke();
  }
}
function wheel(ctx, x, y, r, a, hub) {
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = hub || '#e6e9f5'; ctx.beginPath(); ctx.arc(x, y, r * 0.52, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.2, r * 0.16); ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const q = a + i * Math.PI * 2 / 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(q) * r * 0.5, y + Math.sin(q) * r * 0.5); ctx.stroke();
  }
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x, y, r * 0.16, 0, Math.PI * 2); ctx.fill();
}

/* ---------------- рисунки: ракета ---------------- */
function drawRocket(ctx, x, noseY, s, col, ang) {
  const w = 36 * s, h = 76 * s;
  ctx.save();
  ctx.translate(x, noseY);
  ctx.rotate(ang || 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1.6, 2.6 * s);
  ctx.strokeStyle = INK;
  // боковые плавники (сзади корпуса)
  ctx.fillStyle = col.acc;
  for (const sd of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(sd * w * 0.44, -h * 0.56);
    ctx.quadraticCurveTo(sd * w * 1.0, -h * 0.68, sd * w * 0.95, -h * 1.0);
    ctx.quadraticCurveTo(sd * w * 0.62, -h * 0.9, sd * w * 0.4, -h * 0.88);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // сопло (без огня)
  ctx.fillStyle = '#c3cae0';
  rr(ctx, -w * 0.24, -h * 1.05, w * 0.48, h * 0.12, 3 * s); ctx.fill(); ctx.stroke();
  // корпус
  const body = new Path2D();
  body.moveTo(0, 0);
  body.bezierCurveTo(w * 0.34, -h * 0.05, w * 0.5, -h * 0.2, w * 0.5, -h * 0.4);
  body.lineTo(w * 0.5, -h * 0.84);
  body.quadraticCurveTo(w * 0.5, -h * 0.97, w * 0.3, -h * 0.97);
  body.lineTo(-w * 0.3, -h * 0.97);

/* ---------------- холст и разметка ---------------- */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const bg = document.createElement('canvas');
const bgx = bg.getContext('2d');
let W = 0, H = 0, DPR = 1;
const LY = {};   // разметка экрана
function readSafe() {
  const cs = getComputedStyle(document.getElementById('safe'));
  return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0,
           b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
function layout() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  const sf = readSafe();
  LY.safe = sf;
  LY.hudRow = H < 480 ? 60 : 70;
  LY.hudH = sf.t + LY.hudRow;

  LY.groundY = H - LY.groundH;

  LY.FH = LY.groundY - LY.hudH;

  LY.R = LY.S * 1.2;                                  // масштаб ребёнка
  LY.riderHalf = RIDER_W * 0.5 * LY.R;
  LY.catchHalf = Math.max(RIDER_W * LY.R * 0.6, LY.FW * 0.12);
  LY.handsY = LY.groundY - KID_HANDS * LY.R;
  LY.minX = clamp(LY.riderHalf / LY.FW, 0.02, 0.3);
  LY.laneMin = Math.max(LY.minX, 0.1);

}
function buildBg() {
  bg.width = cvs.width; bg.height = cvs.height;
  const c = bgx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const gy = LY.groundY;
  const sky = c.createLinearGradient(0, 0, 0, gy);
  sky.addColorStop(0, '#6fc9ff'); sky.addColorStop(0.7, '#b6ecff'); sky.addColorStop(1, '#dff7ff');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  // солнышко
  const sx = W - Math.max(70, W * 0.1), sy = LY.hudH + (gy - LY.hudH) * 0.22, sr = clamp(H * 0.05, 22, 46);
  const halo = c.createRadialGradient(sx, sy, sr * 0.5, sx, sy, sr * 2.6);
  halo.addColorStop(0, 'rgba(255,240,150,.55)'); halo.addColorStop(1, 'rgba(255,240,150,0)');
  c.fillStyle = halo; c.fillRect(sx - sr * 3, sy - sr * 3, sr * 6, sr * 6);
  c.fillStyle = '#ffe36b'; c.beginPath(); c.arc(sx, sy, sr, 0, Math.PI * 2); c.fill();
  // холмы
  const hill = (base, amp, len, ph, col) => {
    c.fillStyle = col; c.beginPath(); c.moveTo(0, gy);
    for (let x = 0; x <= W + 10; x += 10) c.lineTo(x, base - amp * (0.5 + 0.5 * Math.sin(x / len + ph)));
    c.lineTo(W, gy); c.closePath(); c.fill();
  };
  hill(gy - 4, clamp(H * 0.09, 30, 90), Math.max(90, W / 6), 1.2, '#b4ecb0');
  hill(gy - 2, clamp(H * 0.055, 18, 55), Math.max(60, W / 9), 4.0, '#8fdc87');
  // кустики
  for (let i = 0; i < Math.ceil(W / 140); i++) {
    const bx = (i * 140 + 50 + (i * 37) % 60), br = clamp(H * 0.02, 9, 18);
    c.fillStyle = '#6fcb68';
    c.beginPath(); c.arc(bx, gy - 4, br, Math.PI, 0); c.arc(bx + br * 1.3, gy - 4, br * 0.8, Math.PI, 0); c.fill();
  }
  // дорога и трава
  const roadH = LY.groundH * 0.42;
  c.fillStyle = '#aab1cb'; c.fillRect(0, gy - 3, W, roadH + 3);
  c.fillStyle = '#c9cee2'; c.fillRect(0, gy - 3, W, 4);
  c.fillStyle = '#ffffff';
  for (let x = 10; x < W; x += 54) { rr(c, x, gy + roadH * 0.45, 28, Math.max(3, roadH * 0.16), 2); c.fill(); }
  c.fillStyle = '#5cc95a'; c.fillRect(0, gy + roadH, W, H - gy - roadH);
  c.fillStyle = '#4bb24a';
  for (let x = 6; x < W; x += 23) {
    const y = gy + roadH + 6 + ((x * 13) % 17) / 17 * Math.max(4, H - gy - roadH - 14);
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + 3, y - 7); c.lineTo(x + 6, y); c.closePath(); c.fill();
  }
  const fc = ['#ffd23f', '#ff70a6', '#ffffff', '#b388ff'];
  for (let x = 30, i = 0; x < W; x += 71, i++) {
    const y = gy + roadH + 8 + ((x * 7) % 11) / 11 * Math.max(4, H - gy - roadH - 18);
    c.fillStyle = fc[i % 4];
    for (let k = 0; k < 5; k++) { c.beginPath(); c.arc(x + Math.cos(k * 1.256) * 3.2, y + Math.sin(k * 1.256) * 3.2, 2.4, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = '#ff9f1c'; c.beginPath(); c.arc(x, y, 1.8, 0, Math.PI * 2); c.fill();
  }
  // края поля на широком экране
  if (LY.FX > 8) {
    c.fillStyle = 'rgba(255,255,255,.22)';
    c.fillRect(0, 0, LY.FX, gy - 3);
    c.fillRect(LY.FX + LY.FW, 0, W - LY.FX - LY.FW, gy - 3);
    if (LY.FX > 40) {
      for (const tx of [LY.FX - 6 * LY.S, LY.FX + LY.FW + 6 * LY.S]) drawTree(c, tx, gy - 2, LY.S * 1.1);
    }

}
function drawTree(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.strokeStyle = INK; c.lineWidth = 2.6; c.lineJoin = 'round';
  c.fillStyle = '#b07a4a'; rr(c, -7, -60, 14, 60, 4); c.fill(); c.stroke();
  c.fillStyle = '#4fbf55';
  c.beginPath(); c.arc(0, -82, 30, 0, Math.PI * 2); c.arc(-24, -66, 20, 0, Math.PI * 2); c.arc(24, -66, 20, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(0, -82, 30, 0, Math.PI * 2); c.stroke();

  for (const [ax, ay] of [[-12, -86], [10, -70], [16, -94], [-20, -64]]) { c.beginPath(); c.arc(ax, ay, 4, 0, Math.PI * 2); c.fill(); }

/* ---------------- состояние игры ---------------- */
let state = 'menu';          // menu | levels | skins | play | pause | ending | win | lose
let T = 0;                   // общее время
let G = null;                // текущий забег (или демо в меню)
const keys = { left: false, right: false };
let kbActive = false;

function newPlayer() {
  return { x: 0.5, target: null, vx: 0, kv: 0, dir: 1, wheelA: 0, lean: 0, bounce: 0, armsUp: 0, moved: 0 };
}
function newRun(levelIdx, demo) {
  return {
    demo: !!demo, level: levelIdx, L: demo ? { goal: 1e9, fall: 4.6, every: 1.9, warn: 0.6, double: 0, near: 0 } : LEVELS[levelIdx],
    time: 0, nextSpawn: demo ? 0.4 : FIRST_DELAY, warns: [], rockets: [], parts: [],
    caught: 0, lives: LIVES, streak: 0, nearLeft: demo ? 0 : LEVELS[levelIdx].near,
    lastArr: null, lastLane: -1, endT: 0, result: null, banner: demo ? 0 : 1.6,
    tutorial: (!demo && levelIdx === 0) ? 4 : 0, heartAnim: [0, 0, 0], countPop: 0,
    player: newPlayer(),
  };
}

/* выбор места ракеты: так, чтобы игрок на стрелках успевал доехать */
function pickX(run, arriveT) {
  const P = run.player;
  let lo = LY.laneMin, hi = 1 - LY.laneMin;
  if (run.lastArr) {
    const R = 0.75 * PLAYER_SPEED * Math.max(0.05, arriveT - run.lastArr.t);
    lo = Math.max(lo, run.lastArr.x - R); hi = Math.min(hi, run.lastArr.x + R);
  }
  if (run.nearLeft > 0) {
    run.nearLeft--;
    lo = Math.max(lo, P.x - 0.1); hi = Math.min(hi, P.x + 0.1);
  }
  if (lo > hi) { const m = (lo + hi) / 2; lo = hi = clamp(m, LY.laneMin, 1 - LY.laneMin); }
  // «то слева, то справа, то посередине»
  const lanes = [0.2, 0.5, 0.8].map((v, i) => ({ i, x: v + rand(-0.09, 0.09) })).filter(l => l.x >= lo && l.x <= hi);
  let x, lane = -1;
  if (lanes.length) {
    let pool = lanes.filter(l => l.i !== run.lastLane);
    if (!pool.length || Math.random() < 0.2) pool = lanes;
    const l = pick(pool); x = l.x; lane = l.i;
  } else x = rand(lo, hi);
  run.lastLane = lane;
  return clamp(x, LY.laneMin, 1 - LY.laneMin);
}
function inFlight(run) { return run.rockets.length + run.warns.length; }
function spawnLogic(run, dt) {
  run.nextSpawn -= dt;
  if (run.nextSpawn > 0) return;
  const L = run.L;
  const remaining = L.goal - run.caught - inFlight(run);
  if (remaining <= 0) return;
  const addWarn = (delay) => {
    const arrive = run.time + delay + L.fall;
    const x = pickX(run, arrive);
    run.lastArr = { x, t: arrive };
    run.warns.push({ x, left: delay, total: delay, col: pick(ROCKET_COLORS) });
  };
  addWarn(L.warn);
  let extra = 0;
  if (remaining >= 2 && Math.random() < L.double) {
    // вторая ракета пары — рядом, чтобы обе можно было поймать
    const arrive = run.time + L.warn + PAIR_GAP + L.fall;
    const prev = run.lastArr.x;
    const R = Math.min(0.42, 0.75 * PLAYER_SPEED * PAIR_GAP);
    const opts = [];
    for (const sd of [-1, 1]) {
      const a = prev + sd * 0.2, b = prev + sd * R;
      const lo = Math.max(LY.laneMin, Math.min(a, b)), hi = Math.min(1 - LY.laneMin, Math.max(a, b));
      if (lo <= hi) opts.push([lo, hi]);
    }
    if (opts.length) {
      const [lo, hi] = pick(opts);
      const x = rand(lo, hi);
      run.lastArr = { x, t: arrive };
      run.warns.push({ x, left: L.warn + PAIR_GAP, total: L.warn + PAIR_GAP, col: pick(ROCKET_COLORS) });
      extra = PAIR_GAP;
    }
  }
  run.nextSpawn = L.every * rand(0.85, 1.15) + extra;
}

/* ---------------- частицы ---------------- */
function addStars(run, x, y, n, power, sizeK) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(0.4, 1) * power;
    run.parts.push({ k: 'star', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - power * 0.3, g: power * 0.9,
      life: rand(0.5, 0.9), max: 0.9, r: rand(4, 8) * LY.S * (sizeK || 1), rot: rand(0, 6), vr: rand(-6, 6), col: pick(SPARK_COLORS) });
  }
}
function addPuff(run, x, y) {
  for (let i = 0; i < 8; i++) {
    const a = Math.PI + (i / 7) * Math.PI;
    run.parts.push({ k: 'puff', x: x + Math.cos(a) * 8 * LY.S, y: y - 6 * LY.S, vx: Math.cos(a) * rand(30, 70) * LY.S, vy: Math.sin(a) * rand(15, 45) * LY.S,
      g: 0, life: rand(0.7, 1.0), max: 1.0, r: rand(9, 14) * LY.S, grow: rand(16, 26) * LY.S });
  }
  run.parts.push({ k: 'puff', x, y: y - 14 * LY.S, vx: 0, vy: -20 * LY.S, g: 0, life: 1.0, max: 1.0, r: 16 * LY.S, grow: 22 * LY.S });
}
function addText(run, x, y, txt, col) {
  run.parts.push({ k: 'text', x, y, vx: 0, vy: -70 * LY.S, g: 0, life: 0.9, max: 0.9, txt, col: col || '#ffd23f' });
}
function updateParts(run, dt) {
  const ps = run.parts;
  for (let i = ps.length - 1; i >= 0; i--) {
    const p = ps[i];
    p.life -= dt;
    if (p.life <= 0) { ps.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt;
    if (p.k === 'puff') { p.r += p.grow * dt; p.vx *= 0.94; p.vy *= 0.94; }
    if (p.k === 'star' || p.k === 'trail') p.rot += (p.vr || 0) * dt;
  }
  if (ps.length > 500) ps.splice(0, ps.length - 500);
}
function drawParts(run) {
  for (const p of run.parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.k === 'star' || p.k === 'trail') {
      ctx.globalAlpha = p.k === 'trail' ? a * 0.85 : Math.min(1, a * 1.6);
      ctx.fillStyle = p.col;
      starPath(ctx, p.x, p.y, p.r * (p.k === 'trail' ? (0.4 + 0.6 * a) : 1), p.rot);
      ctx.fill();
    } else if (p.k === 'puff') {
      ctx.globalAlpha = a * 0.95;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = a * 0.5;
      ctx.strokeStyle = '#b7bfd8'; ctx.lineWidth = 2;
      ctx.stroke();
    } else if (p.k === 'text') {
      ctx.globalAlpha = Math.min(1, a * 2);
      const fs = Math.round(clamp(30 * LY.S, 20, 44));
      ctx.font = '900 ' + fs + 'px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round'; ctx.lineWidth = fs * 0.22; ctx.strokeStyle = INK;
      ctx.strokeText(p.txt, p.x, p.y); ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------------- обновление ---------------- */
function px(fx) { return LY.FX + fx * LY.FW; }
function noseYOf(r) { return r.t * LY.groundY; }

function updatePlayer(run, dt, auto) {
  const P = run.player;
  const old = P.x;
  if (auto) {
    // демо в меню: едет к самой низкой ракете
    let best = null;
    for (const r of run.rockets) if (!best || r.t > best.t) best = r;
    const tgt = best ? best.x : 0.5 + 0.3 * Math.sin(T * 0.6);
    const d = tgt - P.x;
    P.x += clamp(d * dt * 3, -0.7 * dt, 0.7 * dt);
  } else {
    const kd = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (kd !== 0 || (kbActive && Math.abs(P.kv) > 0.01)) {
      P.kv += (kd * PLAYER_SPEED - P.kv) * Math.min(1, dt * 12);
      P.x += P.kv * dt;
      P.target = null;
    } else if (P.target != null) {
      const d = P.target - P.x;
      const maxStep = 2.6 * dt;
      P.x += clamp(d * Math.min(1, dt * 16), -maxStep, maxStep);
    }
  }
  P.x = clamp(P.x, LY.minX, 1 - LY.minX);
  if (Math.abs(P.x - old) < 1e-6 && !auto) P.kv = keys.left || keys.right ? P.kv : 0;
  const vx = (P.x - old) / Math.max(dt, 1e-4);
  P.vx = lerp(P.vx, vx, Math.min(1, dt * 10));
  P.moved += Math.abs(P.x - old);
  if (Math.abs(P.vx) > 0.06) P.dir = P.vx > 0 ? 1 : -1;
  P.lean = lerp(P.lean, clamp(P.vx * 0.14, -0.18, 0.18), Math.min(1, dt * 10));
  P.wheelA += (P.x - old) * LY.FW / (8 * LY.R);
  P.bounce = Math.max(0, P.bounce - dt * 4);
  P.armsUp = Math.max(0, P.armsUp - dt * 3);
}

function updateRun(run, dt) {
  run.time += dt;
  if (run.banner > 0) run.banner -= dt;
  if (run.tutorial > 0) { run.tutorial -= dt; if (run.player.moved > 0.08 && run.time > 1.2) run.tutorial = Math.min(run.tutorial, 0.4); }
  run.countPop = Math.max(0, run.countPop - dt * 3);
  for (let i = 0; i < 3; i++) run.heartAnim[i] = Math.max(0, run.heartAnim[i] - dt * 1.6);
  updatePlayer(run, dt, run.demo);
  const active = run.demo || state === 'play';
  if (active) spawnLogic(run, dt);
  // подсветки → ракеты
  for (let i = run.warns.length - 1; i >= 0; i--) {
    const w = run.warns[i];
    w.left -= dt;
    if (w.left <= 0) {
      run.warns.splice(i, 1);
      run.rockets.push({ x: w.x, t: 0, col: w.col, ph: rand(0, 6), trail: 0 });
      if (!run.demo) SND.appear();
    }
  }
  const P = run.player;
  for (let i = run.rockets.length - 1; i >= 0; i--) {
    const r = run.rockets[i];
    r.t += dt / run.L.fall;
    const ny = noseYOf(r);
    const rx = px(r.x);
    // хвостик из звёздочек
    r.trail -= dt;
    if (r.trail <= 0 && ny > 0) {
      r.trail = 0.045;
      run.parts.push({ k: 'trail', x: rx + rand(-5, 5) * LY.S, y: ny - 80 * LY.S, vx: rand(-14, 14) * LY.S, vy: rand(-30, -10) * LY.S, g: 0,
        life: 0.55, max: 0.55, r: rand(3, 6) * LY.S, rot: rand(0, 6), vr: rand(-4, 4), col: pick(SPARK_COLORS) });
    }
    if (!active && !run.demo) continue;
    const dx = Math.abs(r.x - P.x) * LY.FW;
    if (ny >= LY.handsY && ny <= LY.groundY - 2 && dx <= LY.catchHalf) {
      run.rockets.splice(i, 1);
      onCatch(run, rx, Math.min(ny, LY.handsY + 10 * LY.S));
      continue;
    }
    if (r.t >= 1) {
      run.rockets.splice(i, 1);
      onMiss(run, rx);
    }
  }
  updateParts(run, dt);
}

function onCatch(run, x, y) {
  const P = run.player;
  P.bounce = 1; P.armsUp = 1;
  addStars(run, x, y, run.demo ? 8 : 14, 260 * LY.S);
  if (run.demo) return;
  run.caught++; run.streak++; run.countPop = 1;
  addText(run, x, y - 30 * LY.S, '+1');
  SND.catch(run.streak);
  save.total++; storeSave();
  if (run.caught >= run.L.goal && state === 'play') endRun(run, 'win');
}
function onMiss(run, x) {
  addPuff(run, x, LY.groundY);
  if (run.demo) return;
  run.streak = 0;
  run.lives--;
  if (run.lives >= 0 && run.lives < 3) run.heartAnim[run.lives] = 1;
  SND.miss();
  if (run.lives <= 0 && state === 'play') endRun(run, 'lose');
}
function endRun(run, result) {
  run.result = result;
  state = 'ending';
  run.endT = result === 'win' ? 1.3 : 1.1;
  // оставшиеся в воздухе ракеты мягко исчезают
  for (const r of run.rockets) {
    const x = px(r.x), y = noseYOf(r) - 40 * LY.S;
    if (result === 'win') addStars(run, x, y, 10, 200 * LY.S); else addPuff(run, x, y + 30 * LY.S);
  }
  run.rockets.length = 0; run.warns.length = 0;
  if (result === 'win') {
    SND.win();
    for (let i = 0; i < 6; i++) addStars(run, LY.FX + rand(0.1, 0.9) * LY.FW, LY.hudH + rand(0.1, 0.6) * LY.FH, 10, 320 * LY.S, 1.4);
  } else SND.lose();
}
function finishRun(run) {
  document.body.classList.remove('playing');
  if (run.result === 'win') {
    const lvl = run.level + 1;
    const stars = Math.max(1, run.lives);
    save.passed = Math.max(save.passed, lvl);
    save.stars[run.level] = Math.max(save.stars[run.level] || 0, stars);
    storeSave();
    state = 'win';
    const last = run.level >= LEVELS.length - 1;
    document.getElementById('winTitle').textContent = last ? 'Супер!' : 'Ура!';
    document.getElementById('winSub').textContent = last ? 'Все уровни пройдены!' : 'Поймано ' + run.caught + ' ' + plural(run.caught);
    document.getElementById('winRow').style.display = last ? 'none' : '';
    const ss = document.querySelectorAll('#winStars span');
    ss.forEach((s, i) => {
      s.className = i < stars ? 'on' : '';
      s.style.animationDelay = (0.15 + i * 0.18) + 's';
      void s.offsetWidth; s.classList.add('go');
    });
    showScreen('scrWin');
  } else {
    state = 'lose';
    document.getElementById('loseSub').textContent = 'Поймано ' + run.caught + ' из ' + run.L.goal;
    showScreen('scrLose');
  }
}
function plural(n) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return 'ракету';
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return 'ракеты';
  return 'ракет';
}

function update(dt) {
  T += dt;
  for (const c of clouds) { c.x += c.v * dt; if (c.x > 1.15) { c.x = -0.2; c.y = rand(0.12, 0.55); } }
  if (state === 'pause') return;
  if (!G) return;
  updateRun(G, dt);
  if (state === 'ending') { G.endT -= dt; if (G.endT <= 0) finishRun(G); }
}

/* ---------------- отрисовка ---------------- */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(bg, 0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.88)';
  for (const c of clouds) drawCloud(ctx, c.x * W, LY.hudH * 0.6 + c.y * (LY.groundY - LY.hudH) * 0.7, c.s * clamp(LY.S, 0.7, 1.4));
  if (!G) return;
  const run = G;
  const inGame = !run.demo;
  // подсветка места
  for (const w of run.warns) {
    const x = px(w.x);
    const k = 1 - w.left / w.total;
    const pulse = 0.5 + 0.5 * Math.sin(T * 14);
    const beamH = LY.hudH + 90 * LY.S;
    const g = ctx.createLinearGradient(0, 0, 0, beamH);
    g.addColorStop(0, 'rgba(255,255,255,0.6)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 24 * LY.S, 0, 48 * LY.S, beamH);
    const cy = LY.hudH + 22 * LY.S;
    ctx.fillStyle = hexA(w.col.body, 0.35 + 0.3 * pulse);
    ctx.beginPath(); ctx.arc(x, cy, (16 + 5 * pulse) * LY.S * (0.6 + 0.4 * Math.min(1, k * 3)), 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2.5, 4 * LY.S); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const a = 7 * LY.S, yy = cy + Math.sin(T * 10) * 3 * LY.S;
    ctx.beginPath(); ctx.moveTo(x - a, yy - a * 0.5); ctx.lineTo(x, yy + a * 0.5); ctx.lineTo(x + a, yy - a * 0.5); ctx.stroke();
  }
  // тени ракет на земле — подсказка, куда ехать
  for (const r of run.rockets) {
    const t = clamp(r.t, 0, 1);
    ctx.fillStyle = 'rgba(43,45,66,' + (0.06 + 0.22 * t) + ')';
    ctx.beginPath(); ctx.ellipse(px(r.x), LY.groundY + 2, (8 + 20 * t) * LY.S, (2.5 + 4 * t) * LY.S, 0, 0, Math.PI * 2); ctx.fill();
  }
  // ракеты
  for (const r of run.rockets) drawRocket(ctx, px(r.x), noseYOf(r), LY.S, r.col, Math.sin(T * 3 + r.ph) * 0.07);
  // игрок
  drawRider(ctx, px(run.player.x), LY.groundY, LY.R, run.player, T);
  drawParts(run);
  if (inGame) {
    if (run.tutorial > 0) drawTutorial(run);
    drawHud(run);
    if (run.banner > 0) drawBanner(run);
  }
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function outlinedText(txt, x, y, size, fill, align) {
  ctx.font = '900 ' + size + 'px ' + FONT;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.22; ctx.strokeStyle = INK;
  ctx.strokeText(txt, x, y); ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}
function drawHud(run) {
  const sf = LY.safe;
  const cy = sf.t + LY.hudRow / 2 + (LY.hudRow === 70 ? 0 : 0);
  const narrow = W < 480;
  const hs = narrow ? 27 : (LY.hudRow === 70 ? 34 : 30);
  // сердечки
  for (let i = 0; i < LIVES; i++) {
    const x = sf.l + 12 + hs / 2 + i * (hs + 5);
    const alive = i < run.lives;
    const an = run.heartAnim[i];
    const sc = 1 + Math.sin(an * Math.PI) * 0.45;
    ctx.save(); ctx.translate(x, cy - 2); ctx.scale(sc, sc);
    heartPath(ctx, 0, 0, hs);
    ctx.fillStyle = alive ? '#ff4d6d' : 'rgba(255,255,255,.55)';
    ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke();
    if (alive) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(-hs * 0.24, -hs * 0.16, hs * 0.09, hs * 0.06, -0.6, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  // уровень
  outlinedText('Уровень ' + (run.level + 1), sf.l + 16, sf.t + LY.hudRow + 6, 17, '#fff', 'left');
  // счёт
  const fs = narrow ? 26 : (LY.hudRow === 70 ? 32 : 28);
  const txt = run.caught + ' / ' + run.L.goal;
  ctx.font = '900 ' + fs + 'px ' + FONT;
  const tw = ctx.measureText(txt).width;
  const iconW = fs * 0.9;
  let cx = W / 2;
  const ib = H <= 480 ? 48 : 54;
  const rightLimit = W - sf.r - 20 - 2 * ib - 8;
  const leftLimit = sf.l + 12 + LIVES * (hs + 5) + 6;
  const half = (tw + iconW + 8) / 2;
  if (cx + half > rightLimit) cx = Math.max(leftLimit + half, rightLimit - half);
  const pop = 1 + Math.sin(run.countPop * Math.PI) * 0.2;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(pop, pop);
  drawRocket(ctx, -half + iconW * 0.62, fs * 0.42, fs / 76 * 0.9, ROCKET_COLORS[0], -0.55);
  outlinedText(txt, -half + iconW + 8 + tw / 2, 0, fs, '#ffd23f');
  ctx.restore();
  // полоска прогресса
  const bw = Math.min(LY.FW * 0.42, 220), bh = 9, bx = cx - bw / 2, by = cy + fs * 0.62;
  ctx.fillStyle = 'rgba(43,45,66,.35)'; rr(ctx, bx - 2, by - 2, bw + 4, bh + 4, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.7)'; rr(ctx, bx, by, bw, bh, 5); ctx.fill();
  const k = clamp(run.caught / run.L.goal, 0, 1);
  if (k > 0) { ctx.fillStyle = '#ffd23f'; rr(ctx, bx, by, Math.max(bh, bw * k), bh, 5); ctx.fill(); }
}
function drawBanner(run) {
  const t = run.banner;
  const a = clamp(Math.min(t / 0.35, (1.6 - t) / 0.2), 0, 1);
  ctx.globalAlpha = a;
  const s = 1 + (1 - Math.min(1, (1.6 - t) / 0.25)) * 0.3;
  const y = LY.hudH + LY.FH * 0.32;
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(s, s);
  const big = Math.round(clamp(46 * LY.S, 30, 62));
  outlinedText('Уровень ' + (run.level + 1), 0, 0, big, '#fff');
  outlinedText('Поймай ' + run.L.goal + ' ' + plural(run.L.goal) + '!', 0, big * 0.95, Math.round(big * 0.55), '#ffd23f');
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawTutorial(run) {
  const a = clamp(run.tutorial / 0.4, 0, 1);
  ctx.globalAlpha = a;
  const x = px(run.player.x), y = LY.groundY - KID_HANDS * LY.R * 0.5;
  const off = (RIDER_W * 0.5 + 26) * LY.R + Math.sin(T * 6) * 6 * LY.S;
  for (const sd of [-1, 1]) {
    ctx.save(); ctx.translate(x + sd * off, y); ctx.scale(sd * LY.S * 1.2, LY.S * 1.2);
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-2, -15); ctx.lineTo(-2, -7); ctx.lineTo(-14, -7); ctx.lineTo(-14, 7); ctx.lineTo(-2, 7); ctx.lineTo(-2, 15); ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ---------------- экраны ---------------- */
const screens = ['scrMenu', 'scrLevels', 'scrSkins', 'scrPause', 'scrWin', 'scrLose'];
function showScreen(id) {
  for (const s of screens) document.getElementById(s).classList.toggle('on', s === id);
}
function goMenu() {
  state = 'menu'; document.body.classList.remove('playing');
  if (!G || !G.demo) G = newRun(0, true);
  showScreen('scrMenu');
}
function goLevels() {
  state = 'levels'; document.body.classList.remove('playing');
  if (!G || !G.demo) G = newRun(0, true);
  buildLevels();
  showScreen('scrLevels');
}
function goSkins() {
  state = 'skins';
  if (!G || !G.demo) G = newRun(0, true);
  buildSkins();
  showScreen('scrSkins');
}
function startLevel(i) {
  i = clamp(i, 0, LEVELS.length - 1);
  if (i > save.passed) return;
  G = newRun(i, false);
  state = 'play';
  keys.left = keys.right = false;
  document.body.classList.add('playing');
  showScreen(null);
}
function pauseGame() {
  if (state !== 'play') return;
  state = 'pause';
  document.body.classList.remove('playing');
  showScreen('scrPause');
}
function resumeGame() {
  if (state !== 'pause') return;
  state = 'play';
  keys.left = keys.right = false;
  document.body.classList.add('playing');
  showScreen(null);
}
const LVL_COLORS = ['#3ecf6e', '#4c8dff', '#ff9f1c', '#b388ff', '#ff5d8f'];
function buildLevels() {
  const box = document.getElementById('levels');
  box.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button');
    b.className = 'lvl';
    b.style.setProperty('--c', LVL_COLORS[i % LVL_COLORS.length]);
    const open = i <= save.passed;
    if (!open) { b.classList.add('locked'); b.innerHTML = ICONS.lock; b.setAttribute('aria-label', 'Уровень ' + (i + 1) + ' закрыт'); }
    else {
      b.textContent = String(i + 1);
      b.dataset.level = i;
      b.setAttribute('aria-label', 'Уровень ' + (i + 1));
      const st = save.stars[i] || 0;
      if (i < save.passed && st > 0) {
        const s = document.createElement('span'); s.className = 'stars';
        s.innerHTML = [0, 1, 2].map(k => '<span class="' + (k < st ? 'on' : 'off') + '">★</span>').join('');
        b.appendChild(s);
      }
      if (i === save.passed) b.classList.add('next');
    }
    box.appendChild(b);
  });
}
function buildSkins() {
  const box = document.getElementById('skins');
  box.innerHTML = '';
  for (const sk of SKINS) {
    const card = document.createElement('div');
    card.className = 'skin';
    const cv = document.createElement('canvas');
    cv.width = 260; cv.height = 150;
    card.appendChild(cv);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = sk.name; card.appendChild(nm);
    const open = sk.id === 'scooter';
    if (open) {
      card.classList.add('sel');
      const bd = document.createElement('div'); bd.className = 'badge'; bd.textContent = '✓ Выбран'; card.appendChild(bd);
      const how = document.createElement('div'); how.className = 'how'; how.textContent = 'Открыт'; card.appendChild(how);
    } else {
      card.classList.add('locked');
      const [have, need] = sk.need();
      const how = document.createElement('div'); how.className = 'how';
      how.textContent = have >= need ? 'Скоро в игре!' : sk.how + (need > 5 ? ' (' + Math.min(have, need) + '/' + need + ')' : '');
      card.appendChild(how);
      const bar = document.createElement('div'); bar.className = 'bar';
      bar.innerHTML = '<i style="width:' + Math.round(clamp(have / need, 0, 1) * 100) + '%"></i>';
      card.appendChild(bar);
    }
    box.appendChild(card);
    drawSkinCard(cv, sk.id, !open);
  }
}
function drawSkinCard(cv, id, locked) {
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  c.save();
  c.translate(cv.width / 2, cv.height - 22);
  c.scale(1.7, 1.7);
  VEHICLES[id](c, 0.3, 0);
  c.restore();
  if (locked) {
    c.globalCompositeOperation = 'source-atop';
    c.fillStyle = '#6b6f9a'; c.fillRect(0, 0, cv.width, cv.height);
    c.globalCompositeOperation = 'source-over';
  }
  c.fillStyle = 'rgba(43,45,66,.12)';
  c.beginPath(); c.ellipse(cv.width / 2, cv.height - 20, 80, 6, 0, 0, Math.PI * 2); c.fill();
  if (locked) drawLock(c, cv.width / 2, cv.height / 2 - 10, 1.25);
}

/* ---------------- титул ---------------- */
(function buildTitle() {
  const words = ['Лови', 'ракету'];
  const cols = ['#ff5d73', '#ffd23f', '#4cc9f0', '#7bd389', '#ff9f1c', '#b388ff', '#ff70a6'];
  let k = 0;
  document.getElementById('title').innerHTML = words.map(w =>
    '<span class="w">' + [...w].map(ch => '<span style="color:' + cols[k % cols.length] + ';animation-delay:' + (k++ * 0.12) + 's">' + ch + '</span>').join('') + '</span>'
  ).join(' ');
})();

/* ---------------- ввод ---------------- */
function unlockAudio() { ensureAudio(); }
window.addEventListener('pointerdown', unlockAudio, { capture: true });
window.addEventListener('touchstart', unlockAudio, { capture: true, passive: true });
window.addEventListener('keydown', unlockAudio, { capture: true });

function pointerTo(e) {
  if (!G || G.demo) return;
  if (state !== 'play' && state !== 'ending') return;
  kbActive = false;
  G.player.kv = 0;
  G.player.target = clamp((e.clientX - LY.FX) / LY.FW, LY.minX, 1 - LY.minX);
}
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cvs.setPointerCapture(e.pointerId); } catch (_) {}
  pointerTo(e);
});
cvs.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) pointerTo(e);
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || e.target === cvs) e.preventDefault(); }, { passive: false });

window.addEventListener('keydown', e => {
  const k = e.code || e.key;
  if (k === 'ArrowLeft' || k === 'KeyA' || e.key === 'a' || e.key === 'ф') { keys.left = true; kbActive = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'KeyD' || e.key === 'd' || e.key === 'в') { keys.right = true; kbActive = true; e.preventDefault(); }
  else if (k === 'Escape' || k === 'KeyP') {
    if (state === 'play') pauseGame(); else if (state === 'pause') resumeGame();
    e.preventDefault();
  } else if (k === 'Enter' || k === 'Space') {
    const scr = document.querySelector('.screen.on');
    if (scr && document.activeElement && document.activeElement.tagName === 'BUTTON' && scr.contains(document.activeElement)) return;
    if (scr) {
      const b = scr.querySelector('.panel .btn:not(.small)') || scr.querySelector('#btnPlay');
      if (b && b.offsetParent) { b.click(); e.preventDefault(); }
    }
  }
});
window.addEventListener('keyup', e => {
  const k = e.code || e.key;
  if (k === 'ArrowLeft' || k === 'KeyA' || e.key === 'a' || e.key === 'ф') keys.left = false;
  if (k === 'ArrowRight' || k === 'KeyD' || e.key === 'd' || e.key === 'в') keys.right = false;
});
window.addEventListener('blur', () => { keys.left = keys.right = false; });

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'btnSound') { ensureAudio(); setMuted(!save.muted); SND.click(); b.blur(); return; }
  if (b.id === 'btnPause') { SND.click(); pauseGame(); b.blur(); return; }
  if (b.dataset.level != null) { SND.click(); startLevel(+b.dataset.level); return; }
  const act = b.dataset.act;
  if (!act) return;
  SND.click();
  b.blur();
  if (act === 'levels') goLevels();
  else if (act === 'skins') goSkins();
  else if (act === 'menu') goMenu();
  else if (act === 'resume') resumeGame();
  else if (act === 'restart') startLevel(G && !G.demo ? G.level : 0);
  else if (act === 'next') startLevel((G && !G.demo ? G.level : 0) + 1);
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    pauseGame();
    try { if (actx && actx.state === 'running') actx.suspend(); } catch (e) {}
  } else {
    try { if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {}
  }
});
let rzT = 0;
window.addEventListener('resize', () => { clearTimeout(rzT); layout(); rzT = setTimeout(layout, 120); });
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

/* ---------------- запуск ---------------- */
loadSave();
setMuted(save.muted);
layout();
goMenu();
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// для автотестов
window.__rc = {
  get state() { return state; },
  get run() { return G; },
  get layout() { return LY; },
  get save() { return save; },
  toPx: px,
};
</script>
</body>
</html>
